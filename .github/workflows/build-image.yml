name: Build AEKO Application Backend Image

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            docker buildx build \
              --file Dockerfile \
              --tag "aeko-ci/aeko-backend:${SHA_TAG}" \
              .
          else
            : "${REGISTRY_USER:?DOCKERHUB_USERNAME secret is required for image publishing}"
            docker buildx build \
              --file Dockerfile \
              --tag "${REGISTRY_USER}/aeko-backend:latest" \
              --tag "${REGISTRY_USER}/aeko-backend:${SHA_TAG}" \
              --push \
              .
          fi
